<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>Media Releases</title>
<style>
:root{--text:#f5f7fa;--muted:#8e9aa7;--line:#26313c;--kino:#ff6670;--stream:#4ce0a8;--disc:#55b5ff;--ps:#c08aff;--nin:#ffab55}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
body{min-height:100vh}
.app{width:100%;min-height:100vh;background:radial-gradient(circle at 50% -15%,#182633 0,#090d12 34%,#030405 76%);padding:max(15px,env(safe-area-inset-top)) 26px 58px}
header{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:31px;line-height:.86;letter-spacing:.04em;margin:0;font-weight:900}
.sub{margin-top:6px;color:#aeb8c2;font-size:9px;font-weight:700;letter-spacing:.14em}
.clock{text-align:right;color:#aeb8c2;font-size:10px;line-height:1.25;padding-top:1px}
.clock strong{display:block;color:#fff;font-size:26px;letter-spacing:.02em}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px 0;border-bottom:1px solid var(--line);font-size:9px;font-weight:900;text-align:center;white-space:nowrap}
.k{color:var(--kino)}.s{color:var(--stream)}.d{color:var(--disc)}.p{color:var(--ps)}.n{color:var(--nin)}
#months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px;align-items:start}
.month{padding:14px 0 10px;border-bottom:1px solid var(--line)}
.mn{font-size:21px;font-weight:900;letter-spacing:.035em;margin-bottom:7px}
.rule{height:1px;background:linear-gradient(90deg,#738290,#2b3742 72%,transparent);margin-bottom:6px}
.rel{display:grid;grid-template-columns:53px minmax(0,1fr);gap:5px;align-items:start;padding:5px 0}
.date{font-size:14px;font-weight:900;color:#e1e6eb}
.ent{min-width:0}
.meta{font-size:8px;font-weight:900;letter-spacing:.045em;margin-bottom:2px;white-space:nowrap}
.title{font-size:14px;line-height:1.12;font-weight:850;letter-spacing:-.012em;white-space:normal;overflow-wrap:anywhere}
.more{display:none}
.ticker{position:fixed;left:0;right:0;bottom:0;height:44px;background:#0b1117;border-top:1px solid #344351;display:flex;align-items:center;overflow:hidden;z-index:20}
.ticker-label{height:100%;display:flex;align-items:center;padding:0 16px;background:#17222d;font-size:9px;font-weight:950;letter-spacing:.12em;white-space:nowrap;z-index:2}
.ticker-window{overflow:hidden;flex:1}
.ticker-track{display:inline-flex;align-items:center;gap:38px;white-space:nowrap;padding-left:100%;animation:ticker 34s linear infinite;font-size:11px;font-weight:850}
.ticker-item .td{color:#aeb8c2;margin-right:7px}.ticker-item .tm{font-size:8px;margin-right:5px}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (orientation:portrait){#months{grid-template-columns:1fr}.ticker{display:none}}
</style>
</head>
<body>
<main class="app">
<header>
 <div><h1>MEDIA<br>RELEASES</h1><div class="sub">DEINE HIGHLIGHTS · KINO · STREAMING · GAMES</div></div>
 <div class="clock"><span id="today">--</span><strong id="clock">--:--</strong></div>
</header>
<div class="legend">
 <div class="k">🎬 KINO</div><div class="s">▶️ STREAM</div><div class="d">💿 BLU-RAY / 4K</div><div class="p">🎮 PS5</div><div class="n">◉▮ SWITCH</div>
</div>
<div id="months"></div>
<div class="more">WEITERE MONATE · NACH UNTEN SCROLLEN</div>
<div class="ticker"><div class="ticker-label">COMING UP</div><div class="ticker-window"><div class="ticker-track" id="tickerTrack"></div></div></div>
</main>
<script>
const DATA = {"releases": [{"date": "2026-09-02", "category": "streaming", "label": "DISNEY+", "title": "STAR WARS: THE MANDALORIAN & GROGU"}, {"date": "2026-09-15", "category": "ps5", "label": "PS5", "title": "MARVEL’S WOLVERINE"}, {"date": "2026-09-23", "category": "streaming", "label": "DISNEY+", "title": "TOY STORY 5"}, {"date": "2026-10-09", "category": "bluray", "label": "4K / BLU-RAY", "title": "STAR WARS: ANDOR · S1"}, {"date": "2026-10-23", "category": "ps5switch", "label": "PS5 / SWITCH 2", "title": "CALL OF DUTY: MODERN WARFARE 4"}, {"date": "2026-11-05", "category": "switch", "label": "SWITCH 2", "title": "THE LEGEND OF ZELDA: OCARINA OF TIME"}, {"date": "2026-11-11", "category": "streaming", "label": "PRIME VIDEO", "title": "DER HERR DER RINGE: DIE RINGE DER MACHT · S3"}, {"date": "2026-11-19", "category": "ps5", "label": "PS5", "title": "GRAND THEFT AUTO VI"}, {"date": "2026-11-19", "category": "kino", "label": "KINO", "title": "DIE TRIBUTE VON PANEM: SUNRISE ON THE REAPING"}, {"date": "2026-12-16", "category": "kino", "label": "KINO", "title": "AVENGERS: DOOMSDAY"}, {"date": "2026-12-17", "category": "kino", "label": "KINO", "title": "DUNE: PART THREE"}, {"date": "2026-12-25", "category": "streaming", "label": "HBO MAX", "title": "HARRY POTTER · S1"}, {"date": "2027-04-08", "category": "ps5switch", "label": "PS5 / SWITCH 2", "title": "FINAL FANTASY VII REVELATION"}, {"date": "2027-04-29", "category": "kino", "label": "KINO", "title": "THE LEGEND OF ZELDA"}, {"date": "2027-05-26", "category": "kino", "label": "KINO", "title": "STAR WARS: STARFIGHTER"}, {"date": "2027-11-25", "category": "kino", "label": "KINO", "title": "DIE EISKÖNIGIN 3"}, {"date": "2027-12-15", "category": "kino", "label": "KINO", "title": "AVENGERS: SECRET WARS"}, {"date": "2027-12-16", "category": "kino", "label": "KINO", "title": "DER HERR DER RINGE: DIE JAGD NACH GOLLUM"}]};
const icons={kino:["k","🎬"],streaming:["s","▶️"],bluray:["d","💿"],ps5:["p","🎮"],switch:["n","◉▮"],ps5switch:["p","🎮"]};
const names=["JANUAR","FEBRUAR","MÄRZ","APRIL","MAI","JUNI","JULI","AUGUST","SEPTEMBER","OKTOBER","NOVEMBER","DEZEMBER"];
function parse(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function cutoff(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-14);return d}
function meta(r){if(r.category==="ps5switch")return '<span class="p">🎮 PS5</span> / <span class="n">◉▮ SWITCH 2</span>';let [c,i]=icons[r.category]||["",""];return i+" "+r.label}
function render(){
 let items=DATA.releases.filter(r=>parse(r.date)>=cutoff()).sort((a,b)=>a.date.localeCompare(b.date)),groups=new Map();
 items.forEach(r=>{let d=parse(r.date),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
 let entries=[...groups.entries()], main=entries.slice(0,3), later=entries.slice(3).flatMap(x=>x[1]);
 let out="";
 for(const [k,rows] of main){let [y,m]=k.split("-").map(Number);out+=`<section class="month"><div class="mn">${names[m-1]} ${y}</div><div class="rule"></div>`;
  for(const r of rows){let d=parse(r.date),c=(icons[r.category]||[""])[0];out+=`<div class="rel"><div class="date">${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.</div><div class="ent"><div class="meta ${c}">${meta(r)}</div><div class="title">${r.title}</div></div></div>`}
  out+="</section>"
 }
 document.getElementById("months").innerHTML=out;
 let t=later.map(r=>{let d=parse(r.date),c=(icons[r.category]||[""])[0];return `<span class="ticker-item"><span class="td">${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}</span><span class="tm ${c}">${meta(r)}</span>${r.title}</span>`}).join("");
 document.getElementById("tickerTrack").innerHTML=t||'<span class="ticker-item">KEINE WEITEREN HIGHLIGHTS</span>';
}
function tick(){let n=new Date();document.getElementById("today").textContent=n.toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();document.getElementById("clock").textContent=n.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
render();tick();setInterval(tick,1000);
</script>
</body></html>
